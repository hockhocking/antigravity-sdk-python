name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]"

      - name: Run full test suite
        run: pytest -v --tb=short

  build:
    name: Build Release Distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag matches pyproject.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python -c '
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["TAG_NAME"]
          if actual_tag != expected_tag:
              print(
                  f"ERROR: Tag {actual_tag!r} does not match pyproject.toml version {version!r} "
                  f"(expected {expected_tag!r}).",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"Tag {actual_tag} matches pyproject.toml version {version}.")
          '

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel and sdist
        run: python -m build --outdir dist/

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Verify wheel installs and imports cleanly
        env:
          WORKSPACE: ${{ github.workspace }}
        working-directory: /tmp
        run: |
          python -m venv /tmp/release-verify-venv
          /tmp/release-verify-venv/bin/pip install "$WORKSPACE"/dist/*.whl
          /tmp/release-verify-venv/bin/python -c "
          import pathlib
          import google.antigravity as ag
          from google.antigravity import Agent, LocalAgentConfig
          from google.antigravity.connections.local import LocalConnection
          loaded = pathlib.Path(ag.__file__).resolve()
          assert 'site-packages' in loaded.parts, f'Expected site-packages import, got {loaded}'
          print('Verified release wheel import from:', loaded)
          "

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES=$(cat <<'EOF'
          > **Note:** The wheel attached to this GitHub Release is a pure-Python distribution built from this repository and does not bundle the pre-compiled Go `localharness` runtime binary. For platform-specific wheels that include `localharness`, install from [PyPI](https://pypi.org/project/google-antigravity/).
          EOF
          )
          ARGS=(
            release create "$TAG_NAME"
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt
            --repo "$REPO"
            --title "$TAG_NAME"
            --notes "$NOTES"
            --generate-notes
            --verify-tag
          )
          if [[ "$TAG_NAME" == *-* ]] || [[ "$TAG_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
